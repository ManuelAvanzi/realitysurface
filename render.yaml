# Render.com (alternativa a Fly): Blueprint. Il disco persistente richiede il piano Starter.
services:
  - type: web
    name: realitysurface
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /data
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: CODICE_INVITO
        sync: false
    disk:
      name: dati
      mountPath: /data
      sizeGB: 1
