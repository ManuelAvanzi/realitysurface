<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>REALITYSURFACE — viewer</title>
<link rel="stylesheet" href="/static/css/rp.css">
<script type="importmap">{"imports":{"three":"/static/js/three-shim.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>
  html, body { overflow: hidden; background: #000; }
  #ar { position: fixed; inset: 0; overflow: hidden; }
  #ar canvas, #ar video { position: absolute; }
  .hud { position: fixed; left: 0; right: 0; display: flex; gap: 8px; padding: 12px; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud.alto { top: 0; top: env(safe-area-inset-top, 0); }
  .hud.basso { bottom: 0; bottom: env(safe-area-inset-bottom, 0); justify-content: center; }
  .chip { background: #0f1115cc; border: 1px solid var(--bordo); border-radius: 999px; padding: 7px 12px; backdrop-filter: blur(8px); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .chip b { font-weight: 600; }
  .hud button, .hud .btn { background: #0f1115cc; backdrop-filter: blur(8px); border-radius: 999px; }
  .messaggio { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: #0f1115ee; padding: 24px; text-align: center; }
  .messaggio[hidden], .hint[hidden] { display: none; }
  .messaggio .box { max-width: 420px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .messaggio svg.ic { width: 40px; height: 40px; color: var(--accento); }
  .messaggio h2 { font-size: 18px; }
  .messaggio p { margin: 0; color: var(--testo2); }
  .hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; text-align: center; color: #fff; text-shadow: 0 1px 6px #000; }
  .hint .cornice { width: 56vw; max-width: 300px; aspect-ratio: 3 / 4; border: 2px dashed #fff8; border-radius: 10px; margin: 0 auto 10px; }
  .mindar-ui-overlay { background: transparent !important; }
</style>
</head>
<body>
<div id="ar"></div>
<div id="hint" class="hint" hidden><div class="cornice"></div><div>Inquadra la pagina</div></div>
<div class="hud alto">
  <div class="chip"><span id="ic-stato"></span><span><b id="titolo"></b> <span id="pagina" class="muto"></span></span></div>
  <div class="spazio" style="flex:1"></div>
  <button id="btn-modo" title="Passa tra AR e 3D"></button>
</div>
<div class="hud basso">
  <button id="btn-prec" title="Pagina precedente"></button>
  <button id="btn-succ" title="Pagina successiva"></button>
</div>
<div id="messaggio" class="messaggio" hidden><div class="box"><span id="msg-ic"></span><h2 id="msg-titolo"></h2><p id="msg-testo"></p><div id="msg-azioni" class="riga"></div></div></div>
<script type="module" src="/static/viewer/viewer.js"></script>
</body>
</html>
